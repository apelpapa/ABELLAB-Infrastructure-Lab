global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: linux-servers
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          server: LAB-LNX01
          role: monitoring-server
          environment: ABELLAB

  - job_name: windows-servers
    static_configs:
      - targets:
          - 192.168.2.53:9182
        labels:
          server: LAB-DC01
          role: domain-controller
          environment: ABELLAB

      - targets:
          - 192.168.2.54:9182
        labels:
          server: LAB-FS01
          role: file-server
          environment: ABELLAB
